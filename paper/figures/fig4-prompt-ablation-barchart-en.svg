<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 480" width="100%" height="100%" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', sans-serif">
  <defs>
    <linearGradient id="bgGrad4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
  </defs>
  <rect width="1120" height="480" rx="10" fill="url(#bgGrad4)" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Title & Subtitle -->
  <text x="560" y="34" text-anchor="middle" font-size="17" font-weight="700" fill="#0f172a">
    Figure 4: System Prompt Variant Ablation: Willingness vs. Net Effective Compression (DeepSeek 4.1 Flash)
  </text>
  <text x="560" y="55" text-anchor="middle" font-size="12" fill="#64748b">
    Left: Proactive Willingness and Moral Hazard Collapse | Right: Net Effective Compression Ratio and Probe Recall (x/3)
  </text>

  <!-- Legend -->
  <g transform="translate(370, 72)" font-size="11.5" font-weight="600">
    <rect x="0" y="0" width="16" height="12" rx="3" fill="#3b82f6"/>
    <text x="24" y="10" fill="#1e40af">Proactive Willingness (%)</text>

    <rect x="180" y="0" width="16" height="12" rx="3" fill="#10b981"/>
    <text x="204" y="10" fill="#065f46">Net Effective Compression (%)</text>
  </g>

  <!-- ================= LEFT PANEL: Prompt Willingness Bar Chart ================= -->
  <g transform="translate(70, 115)">
    <text x="215" y="-12" text-anchor="middle" font-size="13" font-weight="700" fill="#334155">(a) Proactive Willingness Across Prompt Variants (%)</text>
    <line x1="0" y1="280" x2="430" y2="280" stroke="#cbd5e1" stroke-width="1.5"/>
    <line x1="0" y1="0" x2="0" y2="280" stroke="#cbd5e1" stroke-width="1.5"/>

    <g stroke="#f1f5f9" stroke-width="1">
      <line x1="0" y1="210" x2="430" y2="210"/><line x1="0" y1="140" x2="430" y2="140"/>
      <line x1="0" y1="70" x2="430" y2="70"/><line x1="0" y1="0" x2="430" y2="0"/>
    </g>
    <g font-size="10" fill="#64748b" text-anchor="end">
      <text x="-8" y="284">0%</text><text x="-8" y="214">25%</text><text x="-8" y="144">50%</text>
      <text x="-8" y="74">75%</text><text x="-8" y="4">100%</text>
    </g>

    <!-- P1, P2, P3, P4 -->
    <!-- P1: 33.3% -> 93.2px -->
    <g transform="translate(35, 0)">
      <rect x="0" y="186.8" width="50" height="93.2" rx="4" fill="#3b82f6"/>
      <text x="25" y="180" text-anchor="middle" font-size="11" font-weight="700" fill="#1d4ed8">33.3%</text>
      <text x="25" y="298" text-anchor="middle" font-size="10.5" font-weight="600" fill="#334155">P1 Original Base</text>
      <text x="25" y="312" text-anchor="middle" font-size="9" fill="#64748b">(No Structured Routing)</text>
    </g>

    <!-- P2: 0.0% (Moral Hazard) -->
    <g transform="translate(135, 0)">
      <rect x="0" y="278" width="50" height="2" rx="1" fill="#ef4444"/>
      <text x="25" y="268" text-anchor="middle" font-size="11" font-weight="700" fill="#dc2626">0.0% Collapse</text>
      <text x="25" y="298" text-anchor="middle" font-size="10.5" font-weight="600" fill="#991b1b">P2 Disclosed Fallback</text>
      <text x="25" y="312" text-anchor="middle" font-size="9" fill="#dc2626">(Moral hazard: dropped distillation)</text>
    </g>

    <!-- P3: 100.0% -->
    <g transform="translate(235, 0)">
      <rect x="0" y="0" width="50" height="280" rx="4" fill="#10b981"/>
      <text x="25" y="-6" text-anchor="middle" font-size="11" font-weight="700" fill="#047857">100.0% Full</text>
      <text x="25" y="298" text-anchor="middle" font-size="10.5" font-weight="700" fill="#065f46">P3 Decision Tree</text>
      <text x="25" y="312" text-anchor="middle" font-size="9" font-weight="600" fill="#047857">(Production Pareto Optimal)</text>
    </g>

    <!-- P4: 66.7% -> 186.8px -->
    <g transform="translate(335, 0)">
      <rect x="0" y="93.2" width="50" height="186.8" rx="4" fill="#3b82f6"/>
      <text x="25" y="86" text-anchor="middle" font-size="11" font-weight="700" fill="#1d4ed8">66.7%</text>
      <text x="25" y="298" text-anchor="middle" font-size="10.5" font-weight="600" fill="#334155">P4 Ultra-Minimal</text>
      <text x="25" y="312" text-anchor="middle" font-size="9" fill="#64748b">(Format drift risk)</text>
    </g>
  </g>

  <!-- ================= RIGHT PANEL: Compression Ratio & Constant Recall ================= -->
  <g transform="translate(620, 115)">
    <text x="215" y="-12" text-anchor="middle" font-size="13" font-weight="700" fill="#334155">(b) Net Effective Compression (%) & Probe Recall</text>
    <line x1="0" y1="280" x2="430" y2="280" stroke="#cbd5e1" stroke-width="1.5"/>
    <line x1="0" y1="0" x2="0" y2="280" stroke="#cbd5e1" stroke-width="1.5"/>

    <g stroke="#f1f5f9" stroke-width="1">
      <line x1="0" y1="210" x2="430" y2="210"/><line x1="0" y1="140" x2="430" y2="140"/>
      <line x1="0" y1="70" x2="430" y2="70"/><line x1="0" y1="0" x2="430" y2="0"/>
    </g>
    <g font-size="10" fill="#64748b" text-anchor="end">
      <text x="-8" y="284">0%</text><text x="-8" y="214">25%</text><text x="-8" y="144">50%</text>
      <text x="-8" y="74">75%</text><text x="-8" y="4">100%</text>
    </g>

    <!-- P1: 31.1% -> 87.1px -->
    <g transform="translate(35, 0)">
      <rect x="0" y="192.9" width="50" height="87.1" rx="4" fill="#10b981"/>
      <text x="25" y="186" text-anchor="middle" font-size="11" font-weight="700" fill="#047857">31.1%</text>
      <text x="25" y="298" text-anchor="middle" font-size="10.5" font-weight="600" fill="#334155">P1 Original Base</text>
      <text x="25" y="312" text-anchor="middle" font-size="9" fill="#10b981">Recall: 3/3</text>
    </g>

    <!-- P2: 0.0% -->
    <g transform="translate(135, 0)">
      <rect x="0" y="278" width="50" height="2" rx="1" fill="#ef4444"/>
      <text x="25" y="268" text-anchor="middle" font-size="11" font-weight="700" fill="#dc2626">0.0% No compression</text>
      <text x="25" y="298" text-anchor="middle" font-size="10.5" font-weight="600" fill="#991b1b">P2 Disclosed Fallback</text>
      <text x="25" y="312" text-anchor="middle" font-size="9" fill="#ef4444">Recall: 2/3 (Lost var)</text>
    </g>

    <!-- P3: 91.2% -> 255.4px -->
    <g transform="translate(235, 0)">
      <rect x="0" y="24.6" width="50" height="255.4" rx="4" fill="#059669"/>
      <text x="25" y="17" text-anchor="middle" font-size="11" font-weight="700" fill="#047857">91.2% Highest</text>
      <text x="25" y="298" text-anchor="middle" font-size="10.5" font-weight="700" fill="#065f46">P3 Decision Tree</text>
      <text x="25" y="312" text-anchor="middle" font-size="9" font-weight="700" fill="#047857">Recall: 3/3 Full</text>
    </g>

    <!-- P4: 65.0% -> 182.0px -->
    <g transform="translate(335, 0)">
      <rect x="0" y="98.0" width="50" height="182.0" rx="4" fill="#10b981"/>
      <text x="25" y="91" text-anchor="middle" font-size="11" font-weight="700" fill="#047857">65.0%</text>
      <text x="25" y="298" text-anchor="middle" font-size="10.5" font-weight="600" fill="#334155">P4 Ultra-Minimal</text>
      <text x="25" y="312" text-anchor="middle" font-size="9" fill="#f59e0b">Recall: 2/3 (Drift)</text>
    </g>
  </g>
</svg>