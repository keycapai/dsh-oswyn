name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Node 20 is the declared floor (engines), 22 is the current LTS line,
        # 24 is what the maintainer develops on. Testing all three catches both
        # "too new to be portable" and "too old to support the declared floor".
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm install --no-audit --no-fund

      # A leaked API key once reached this public repository and stayed there for
      # several commits. Catch the next one here rather than in a screenshot.
      # Patterns are narrow on purpose: real provider prefixes plus a long random
      # tail, so documentation placeholders and the REDACTED_KEY marker stay quiet.
      - name: Scan for committed credentials
        run: |
          PATTERNS='sk-[A-Za-z0-9]{20,}|sk-ant-[A-Za-z0-9_-]{20,}|AIza[0-9A-Za-z_-]{30,}|ghp_[A-Za-z0-9]{30,}|gh[opsu]_[A-Za-z0-9]{30,}|npm_[A-Za-z0-9]{30,}|xox[baprs]-[A-Za-z0-9-]{10,}'
          HITS=$(git grep -nEI "$PATTERNS" -- ':!*.lock' ':!package-lock.json' ':!*.md' || true)
          if [ -n "$HITS" ]; then
            echo "::error::Possible committed credential(s) found (values masked):"
            echo "$HITS" | sed -E 's/([A-Za-z0-9_-]{6})[A-Za-z0-9_-]+/\1.../g'
            exit 1
          fi
          echo "No credential-shaped strings found."

      # The client bundle is generated, so a stale lib/client.js would let tests
      # pass against code that is not what ships. Build first, then compare.
      - name: Build client bundle
        run: node lib/client/build.js
      - name: Verify the committed bundle matches the sources
        run: |
          if ! git diff --quiet -- lib/client.js; then
            echo "::error::lib/client.js is out of date; run npm run build:client and commit the result."
            git diff --stat -- lib/client.js
            exit 1
          fi
      - name: Test
        run: node --test test/*.test.js
